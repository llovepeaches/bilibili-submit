name: Release

# 推 tag 即自动：在 Windows 上打包 → 冒烟测试 → 创建 Release 并上传产物
# 产物是**公开直链**，无需登录即可下载：
#   https://github.com/<你的账号>/<仓库名>/releases/download/v0.1.0/xxx
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本号，例如 v0.1.0'
        required: true

permissions:
  contents: write   # 创建 Release、上传资产所需

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt pyinstaller

      - name: 准备 ffmpeg
        run: python tools/setup_ffmpeg.py --dest vendor --force

      # 轻量版：不含 ffmpeg，10MB 左右
      - name: 打包主程序（轻量版）
        run: python -m PyInstaller bili_submit.spec --noconfirm --clean

      # 内置版：ffmpeg 打进归档，单个 exe 开箱即用（约 73MB，解压后约 100MB）
      - name: 打包主程序（内置 ffmpeg 版）
        env:
          BUNDLE_FFMPEG: '1'
          EXE_NAME: bilibili-submit-standalone
        run: python -m PyInstaller bili_submit.spec --noconfirm

      # GUI 版：windowed（无控制台黑框）+ 带上 tkinter + 内嵌 ffmpeg。
      # BUNDLE_FFMPEG=1 显式给上：spec 里 GUI 虽已默认内嵌，
      # 但显式写出来能让"这次构建带了 ffmpeg"在日志里一目了然，
      # 将来若有人改默认值，这里也不会被悄悄带着走。
      - name: 打包图形界面版
        env:
          GUI: '1'
          BUNDLE_FFMPEG: '1'
          EXE_NAME: bilibili-submit-gui
        run: python -m PyInstaller bili_submit.spec --noconfirm

      # 外置份给 full 包用：启动比内嵌快，也不用每次解压 85MB
      - name: 复制外置 ffmpeg 到 dist
        shell: pwsh
        run: Copy-Item vendor\ffmpeg.exe dist\ffmpeg.exe -Force

      - name: 冒烟测试
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # 轻量版
          & .\dist\bilibili-submit.exe --version
          if ($LASTEXITCODE -ne 0) { throw "轻量版 --version 失败 ($LASTEXITCODE)" }
          & .\dist\bilibili-submit.exe --help
          if ($LASTEXITCODE -ne 0) { throw "轻量版 --help 失败 ($LASTEXITCODE)" }

          # 内置版：check 里能看到 ffmpeg 来源，验证内嵌真的生效
          & .\dist\bilibili-submit-standalone.exe --version
          if ($LASTEXITCODE -ne 0) { throw "内置版 --version 失败 ($LASTEXITCODE)" }
          & .\dist\bilibili-submit-standalone.exe check

          # tid 需要网络，偶发失败不阻断打包
          & .\dist\bilibili-submit.exe tid
          if ($LASTEXITCODE -ne 0) { Write-Host "警告: tid 返回 $LASTEXITCODE（网络问题，不阻断）" }

          # check 在未登录时按设计返回 1（登录检查未过），只看能否正常启动。
          & .\dist\bilibili-submit.exe check
          Write-Host "check 退出码 $LASTEXITCODE（未登录返回 1 属正常）"

          # GUI 是 windowed 程序：没有 stdout，不能靠 --version / check 验证。
          # 改为「启动后看它是否立刻退出」——缺 tkinter 时它会静默失败，
          # 这是唯一能自动发现该问题的手段。
          $gui = ".\dist\bilibili-submit-gui.exe"
          if (-not (Test-Path $gui)) { throw "GUI exe 未生成: $gui" }

          # 内嵌 ffmpeg 的 GUI 版应该明显大于只带 tkinter 的体积。
          # 实测参考（v0.2.2）：只带 tkinter 约 13MB，内嵌 ffmpeg 后约 76MB
          # （standalone 72.8MB - 轻量版 10.5MB = ffmpeg 贡献约 62MB）。
          # 不直接检查归档内容（onefile 是压缩包，探测 ffmpeg 很麻烦），
          # 用体积做下限断言，简单且能挡住"忘了带 ffmpeg"这种回归。
          # 40MB 是刻意保守的中间值：远高于 13MB（漏带），远低于 76MB（带了）。
          $guiMB = [math]::Round((Get-Item $gui).Length / 1MB, 1)
          Write-Host "GUI exe 体积: $guiMB MB（预期约 72MB，>= 40MB）"
          if ($guiMB -lt 40) {
            throw "GUI exe 只有 $guiMB MB，ffmpeg 很可能没内嵌进去（预期 >= 40MB）"
          }

          $proc = Start-Process -FilePath $gui -PassThru
          Start-Sleep -Seconds 6
          if ($proc.HasExited) {
            throw "GUI 启动后立即退出（退出码 $($proc.ExitCode)），可能缺少 tkinter"
          }
          Stop-Process -Id $proc.Id -Force
          Write-Host "GUI 启动正常，已关闭"

          # PowerShell 的 step 退出码取自最后一条原生命令的 $LASTEXITCODE，
          # 不显式归零的话，check 的 1 会让整个 step 判为失败。
          exit 0

      - name: 组装两个分发包
        shell: pwsh
        run: |
          # 注意：config 和 README 来自仓库根，不是 dist\。
          # spec 里的 datas 是打进 exe 归档（sys._MEIPASS），不会落到 dist\ 下。
          # 轻量包：轻量 exe + config + README，不含 ffmpeg
          New-Item -ItemType Directory -Force -Path stage-mini | Out-Null
          Copy-Item dist\bilibili-submit.exe stage-mini\
          Copy-Item config stage-mini\ -Recurse
          Copy-Item README.md stage-mini\
          Copy-Item CHANGELOG.md stage-mini\
          Compress-Archive -Path stage-mini\* -DestinationPath `
            dist\bilibili-submit-mini-windows.zip -Force

          # 完整包：轻量 exe + 外置 ffmpeg + config + README。
          # 启动比内嵌版快（不用每次解压 85MB），代价是要带着 ffmpeg.exe 一起拷。
          New-Item -ItemType Directory -Force -Path stage-full | Out-Null
          Copy-Item dist\bilibili-submit.exe stage-full\
          Copy-Item dist\ffmpeg.exe stage-full\
          Copy-Item config stage-full\ -Recurse
          Copy-Item README.md stage-full\
          Copy-Item CHANGELOG.md stage-full\
          Compress-Archive -Path stage-full\* -DestinationPath `
            dist\bilibili-submit-full-windows.zip -Force

          # 两个裸 exe 本来就躺在 dist 下，直接作为资产上传。

          Get-ChildItem dist\*.zip, dist\*.exe | Format-Table Name, `
            @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: 创建 Release 并上传
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $tag = $env:TAG
          $notes = @"
          详见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)。

          ## 下载

          | 资产 | 大小 | 说明 |
          |---|---|---|
          | `bilibili-submit-gui.exe` | ~76 MB | **图形界面版**，双击开窗口操作，ffmpeg 已内置 |
          | `bilibili-submit-standalone.exe` | ~73 MB | 命令行单文件版，ffmpeg 已内置 |
          | `bilibili-submit.exe` | ~11 MB | 命令行轻量 exe，需自备 ffmpeg |
          | `bilibili-submit-full-windows.zip` | ~43 MB | 命令行 exe + 外置 ffmpeg.exe，启动最快 |
          | `bilibili-submit-mini-windows.zip` | ~10 MB | 命令行 exe + config，不含 ffmpeg |

          怎么选：

          - **想要窗口界面** → `bilibili-submit-gui.exe`（ffmpeg 已内置，开箱即用）
          - 想双击就用、不想管 ffmpeg → `standalone`
          - 在意启动速度和体积 → `full`，让 `ffmpeg.exe` 跟着 exe 走
            （启动不用解压 76MB，代价是要带着 ffmpeg.exe 一起拷）

          图形界面版自带扫码登录、投稿表单、批量任务、历史与设置，
          和命令行共用同一套逻辑，两者可以混着用。

          ffmpeg 只影响 `cover: auto` 自动抽帧，其他功能不依赖它。
          内置 ffmpeg 的版本（gui / standalone）启动时会把 ffmpeg
          解压到临时目录，首次启动稍慢，之后有系统缓存会快一些。

          ## 使用

          图形界面版：双击 `bilibili-submit-gui.exe`，先在「登录」页扫码，
          再去「投稿」页选文件填写信息。

          命令行版：

          1. 解压（下载 exe 的话跳过这步）
          2. `bilibili-submit.exe login` 手机扫码登录（**扫完要在手机上点确认**）
          3. `bilibili-submit.exe upload 视频.mp4 --title "标题" --tid 21 --tag "标签"`
          4. `bilibili-submit.exe check` 自检

          ## 注意事项

          - 首次运行可能被杀毒软件拦截：PyInstaller 的启动器常被误判，
            请在 Windows Defender 里添加白名单。带 ffmpeg 的版本
            （gui / standalone）启动时要把内置 ffmpeg 解压到临时目录，
            更容易触发误报。
          - 建议用 Windows Terminal 打开以正确显示二维码；
            传统 cmd 显示乱码时，复制链接到手机打开同样可以登录。
          - 新号投稿频控较严，批量投稿请设置任务间隔。
          - 仅供管理自己的账号投稿使用。
          "@
          gh release create $tag `
            "dist\bilibili-submit-gui.exe#图形界面版（内置 ffmpeg，约 76MB）" `
            "dist\bilibili-submit-standalone.exe#单文件版（内置 ffmpeg，约 73MB）" `
            "dist\bilibili-submit.exe#轻量 exe（不含 ffmpeg，约 11MB）" `
            "dist\bilibili-submit-full-windows.zip#完整版（外置 ffmpeg，约 43MB）" `
            "dist\bilibili-submit-mini-windows.zip#轻量版（不含 ffmpeg，约 10MB）" `
            --repo ${{ github.repository }} `
            --title "bilibili-submit $tag" `
            --notes $notes

      - name: 打印下载链接
        if: always()
        shell: pwsh
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $repo = "${{ github.repository }}"
          Write-Host ""
          Write-Host "公开发布完成，下载链接：" -ForegroundColor Green
          Write-Host "  https://github.com/$repo/releases/download/$env:TAG/bilibili-submit-gui.exe"
          Write-Host "  https://github.com/$repo/releases/download/$env:TAG/bilibili-submit-standalone.exe"
          Write-Host "  https://github.com/$repo/releases/download/$env:TAG/bilibili-submit.exe"
          Write-Host "  https://github.com/$repo/releases/download/$env:TAG/bilibili-submit-full-windows.zip"
          Write-Host "  https://github.com/$repo/releases/download/$env:TAG/bilibili-submit-mini-windows.zip"
