name: Release

# 推 tag 即自动：在 Windows 上打包 → 冒烟测试 → 创建 Release 并上传产物
# 产物是**公开直链**，无需登录即可下载：
#   https://github.com/<你的账号>/<仓库名>/releases/download/v0.1.0/xxx
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本号，例如 v0.1.0'
        required: true

permissions:
  contents: write   # 创建 Release、上传资产所需

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt pyinstaller

      - name: 准备 ffmpeg
        run: python tools/setup_ffmpeg.py --dest vendor --force

      # 轻量版：不含 ffmpeg，10MB 左右
      - name: 打包主程序（轻量版）
        run: python -m PyInstaller bili_submit.spec --noconfirm --clean

      # 内置版：ffmpeg 打进归档，单个 exe 开箱即用（约 73MB，解压后约 100MB）
      - name: 打包主程序（内置 ffmpeg 版）
        env:
          BUNDLE_FFMPEG: '1'
          EXE_NAME: bilibili-submit-standalone
        run: python -m PyInstaller bili_submit.spec --noconfirm

      # GUI 单文件便携版：windowed（无控制台黑框）+ tkinter + 内嵌 ffmpeg。
      # 保留它是因为「拷走即用」是一种真实需求：U 盘、别人的机器、
      # 不想装东西的环境。名字带 -portable 是为了和下面的安装版目录
      # 区分——两者 EXE_NAME 相同但形态不同（单文件 vs 目录），
      # 共用名字会在 dist 下撞车。
      - name: 打包图形界面版（单文件便携版）
        env:
          GUI: '1'
          BUNDLE_FFMPEG: '1'
          EXE_NAME: bilibili-submit-gui-portable
        run: python -m PyInstaller bili_submit.spec --noconfirm

      # 外置份给 full 包用：启动比内嵌快，也不用每次解压 85MB
      - name: 复制外置 ffmpeg 到 dist
        shell: pwsh
        run: Copy-Item vendor\ffmpeg.exe dist\ffmpeg.exe -Force

      # 安装版：onedir 目录版。ffmpeg **不进归档**，而是放到 exe 同目录——
      # 每次启动省掉解压 60MB 到 %TEMP%，而且用户能自己换 ffmpeg 版本
      # （ffmpeg.py 本来就优先找这个位置）。目录名 = EXE_NAME。
      # 产物结构：dist\bilibili-submit-gui\{exe, ffmpeg.exe, _internal\, config\}
      #
      # --clean 只清 build\ 缓存、不动 dist\ 里已有的 exe（已实测），
      # 所以这里可以放心用，上面的轻量版/standalone/portable 都还在。
      - name: 打包图形界面版（安装用onedir）
        env:
          GUI: '1'
          INSTALLER: '1'
          EXE_NAME: bilibili-submit-gui
        run: python -m PyInstaller bili_submit.spec --noconfirm --clean

      - name: 整理安装版目录
        shell: pwsh
        run: |
          $dir = "dist\bilibili-submit-gui"
          Copy-Item vendor\ffmpeg.exe "$dir\ffmpeg.exe" -Force
          Copy-Item config "$dir\config" -Recurse -Force
          Copy-Item README.md "$dir\README.md" -Force
          Get-ChildItem $dir | Format-Table Name, `
            @{n='MB';e={[math]::Round($_.Length/1MB,2)}} -AutoSize

      - name: 安装 Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress --limit-output

      - name: 编译安装器
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "找不到 ISCC.exe" }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC 编译失败 ($LASTEXITCODE)" }

      - name: 冒烟测试
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # 轻量版
          & .\dist\bilibili-submit.exe --version
          if ($LASTEXITCODE -ne 0) { throw "轻量版 --version 失败 ($LASTEXITCODE)" }
          & .\dist\bilibili-submit.exe --help
          if ($LASTEXITCODE -ne 0) { throw "轻量版 --help 失败 ($LASTEXITCODE)" }

          # 内置版：check 里能看到 ffmpeg 来源，验证内嵌真的生效
          & .\dist\bilibili-submit-standalone.exe --version
          if ($LASTEXITCODE -ne 0) { throw "内置版 --version 失败 ($LASTEXITCODE)" }
          & .\dist\bilibili-submit-standalone.exe check

          # tid 需要网络，偶发失败不阻断打包
          & .\dist\bilibili-submit.exe tid
          if ($LASTEXITCODE -ne 0) { Write-Host "警告: tid 返回 $LASTEXITCODE（网络问题，不阻断）" }

          # check 在未登录时按设计返回 1（登录检查未过），只看能否正常启动。
          & .\dist\bilibili-submit.exe check
          Write-Host "check 退出码 $LASTEXITCODE（未登录返回 1 属正常）"

          # GUI 单文件便携版：windowed 程序，没有 stdout，不能靠 --version /
          # check 验证。改为「启动后看它是否立刻退出」——缺 tkinter 时它会
          # 静默失败，这是唯一能自动发现该问题的手段。
          $gui = ".\dist\bilibili-submit-gui-portable.exe"
          if (-not (Test-Path $gui)) { throw "GUI 单文件版未生成: $gui" }

          # 内嵌 ffmpeg 的单文件版应该明显大于只带 tkinter 的体积。
          # 实测参考（v0.2.2）：只带 tkinter 约 13MB，内嵌 ffmpeg 后约 76MB。
          # 40MB 是刻意保守的中间值：远高于 13MB（漏带），远低于 76MB。
          $guiMB = [math]::Round((Get-Item $gui).Length / 1MB, 1)
          Write-Host "GUI 单文件版体积: $guiMB MB（预期约 76MB，>= 40MB）"
          if ($guiMB -lt 40) {
            throw "GUI exe 只有 $guiMB MB，ffmpeg 很可能没内嵌进去（预期 >= 40MB）"
          }

          $proc = Start-Process -FilePath $gui -PassThru
          Start-Sleep -Seconds 6
          if ($proc.HasExited) {
            throw "GUI 启动后立即退出（退出码 $($proc.ExitCode)），可能缺少 tkinter"
          }
          Stop-Process -Id $proc.Id -Force
          Write-Host "GUI 单文件版启动正常"

          # 安装版目录（onedir）：结构与单文件版完全不同，必须逐项核对。
          # 这里最容易漏的是 _internal\——少了它 exe 在、能双击、一启动就
          # 闪退，而任何"文件存在"检查都发现不了。
          $guiDir = ".\dist\bilibili-submit-gui"
          $guiExe = "$guiDir\bilibili-submit-gui.exe"
          if (-not (Test-Path $guiExe)) { throw "安装版主程序未生成: $guiExe" }
          if (-not (Test-Path "$guiDir\ffmpeg.exe")) {
            throw "安装版缺少 ffmpeg.exe（必须在 exe 同目录，不能在 _internal 里）"
          }
          if (-not (Test-Path "$guiDir\_internal")) {
            throw "安装版缺少 _internal\（Python 运行时，缺了会双击闪退）"
          }
          if (-not (Test-Path "$guiDir\config\config.example.yaml")) {
            throw "安装版缺少 config\config.example.yaml"
          }

          # 目录版体积约 75MB（13MB 程序 + 62MB ffmpeg），明显小于
          # 单文件版的 76MB——因为不再有归档压缩层的开销。
          $dirMB = [math]::Round(
            ((Get-ChildItem $guiDir -Recurse | Measure-Object Length -Sum).Sum) / 1MB, 1)
          Write-Host "安装版目录体积: $dirMB MB"
          if ($dirMB -lt 40) {
            throw "安装版目录只有 $dirMB MB，ffmpeg 或 _internal 很可能没打进去"
          }

          $proc2 = Start-Process -FilePath $guiExe -PassThru
          Start-Sleep -Seconds 8
          if ($proc2.HasExited) {
            throw "安装版启动后立即退出（退出码 $($proc2.ExitCode)）"
          }
          Stop-Process -Id $proc2.Id -Force
          Write-Host "安装版启动正常"

          # 安装器本体：编译成功还不够，必须真的装一遍——"装完双击闪退"
          # 这种问题只有装过才知道。
          $setup = ".\dist\bilibili-submit-setup.exe"
          if (-not (Test-Path $setup)) { throw "安装器未生成: $setup" }
          $setupMB = [math]::Round((Get-Item $setup).Length / 1MB, 1)
          Write-Host "安装器体积: $setupMB MB"
          if ($setupMB -lt 20) {
            throw "安装器只有 $setupMB MB，ffmpeg 或 _internal 很可能没打进去"
          }

          # 必须 Start-Process -Wait：安装器是 GUI 程序，用 `& $setup`
          # 调用时 PowerShell 立即返回、$LASTEXITCODE 从不被赋值
          # （"静默安装失败 ()"——CI 上真卡过这一下），等不到结果。
          # 参数先存数组，免得写多行——PowerShell 的续行符是反引号 `
          # 不是反斜杠 \，写成 \ 的话每行会被当成独立命令（CI 上真报过
          # "The term '-ArgumentList' is not recognized"）。
          # 安装也用轮询而不是 -Wait：Inno Setup 在 /VERYSILENT 下若卡在
          # UAC 提权上会一直不返回（CI 上挂死过 8 分钟，只能手动取消）。
          # 轮询 + 超时，超时就杀掉并报明确错误——挂死比失败难查得多。
          # /CURRENTUSER 同样是为了绕开 UAC：静默安装 + PrivilegesRequired=admin
          # 会让安装器 fork 自己去提权，父进程立即退出、子进程等 UAC 确认，
          # 无人值守的 CI 上就是永久挂起（详见 build-installer.yml 的注释）。
          $setupArgs = @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/CURRENTUSER")
          Write-Host "开始静默安装..."
          $setupProc = Start-Process -FilePath $setup -ArgumentList $setupArgs -PassThru
          $waited = 0
          while (-not $setupProc.HasExited -and $waited -lt 120) {
            Start-Sleep -Seconds 3
            $waited += 3
          }
          if (-not $setupProc.HasExited) {
            Get-Process -Name "bilibili-submit-setup" -ErrorAction SilentlyContinue |
              Stop-Process -Force
            throw "静默安装超时（${waited}s）——安装器卡住了（多半是 UAC 提权）"
          }
          Write-Host "安装结束，退出码 $($setupProc.ExitCode)，耗时 ${waited}s"
          if ($setupProc.ExitCode -ne 0) { throw "静默安装失败 ($($setupProc.ExitCode))" }
          Start-Sleep -Seconds 3

          $installed = "$env:LOCALAPPDATA\Programs\bilibili-submit"
          if (-not (Test-Path "$installed\bilibili-submit-gui.exe")) {
            throw "安装后找不到主程序（目录：$installed）"
          }
          foreach ($f in @("ffmpeg.exe", "_internal", "config\config.example.yaml", "README.md")) {
            if (-not (Test-Path "$installed\$f")) { throw "安装后缺少 $f" }
          }

          $proc3 = Start-Process -FilePath "$installed\bilibili-submit-gui.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($proc3.HasExited) {
            throw "安装后的程序启动即退出（退出码 $($proc3.ExitCode)）"
          }
          # 按进程名杀：PyInstaller 可能留子进程，残留会让卸载器一直
          # 等着程序关闭（CI 上挂死过）。
          Get-Process -Name "bilibili-submit-gui" -ErrorAction SilentlyContinue |
            Stop-Process -Force
          Start-Sleep -Seconds 2
          Write-Host "安装版安装 + 启动正常"

          # 卸载器也要能跑：坏掉的卸载器会留下 Program Files 碎片，
          # 下次升级直接被挡。
          $unins = "$installed\unins000.exe"
          if (-not (Test-Path $unins)) { throw "缺少卸载器" }
          # 不用 -Wait：卸载器卡在 UAC 或残留进程上会永远不返回。
          $up = Start-Process -FilePath $unins -ArgumentList "/VERYSILENT" -PassThru
          $waited = 0
          while (-not $up.HasExited -and $waited -lt 90) {
            Start-Sleep -Seconds 3
            $waited += 3
          }
          if (-not $up.HasExited) {
            Stop-Process -Id $up.Id -Force
            throw "静默卸载超时（${waited}s）——卸载器卡住了（UAC 或残留进程？）"
          }
          if ($up.ExitCode -ne 0) { throw "静默卸载失败 ($($up.ExitCode))" }
          Start-Sleep -Seconds 2
          if (Test-Path "$installed\bilibili-submit-gui.exe") {
            throw "卸载后主程序仍在：卸载不干净"
          }
          Write-Host "安装版安装 + 启动 + 卸载全流程正常（卸载 ${waited}s）"

          # PowerShell 的 step 退出码取自最后一条原生命令的 $LASTEXITCODE，
          # 不显式归零的话，check 的 1 会让整个 step 判为失败。
          exit 0

      - name: 组装两个分发包
        shell: pwsh
        run: |
          # 注意：config 和 README 来自仓库根，不是 dist\。
          # spec 里的 datas 是打进 exe 归档（sys._MEIPASS），不会落到 dist\ 下。
          # 轻量包：轻量 exe + config + README，不含 ffmpeg
          New-Item -ItemType Directory -Force -Path stage-mini | Out-Null
          Copy-Item dist\bilibili-submit.exe stage-mini\
          Copy-Item config stage-mini\ -Recurse
          Copy-Item README.md stage-mini\
          Copy-Item CHANGELOG.md stage-mini\
          Compress-Archive -Path stage-mini\* -DestinationPath `
            dist\bilibili-submit-mini-windows.zip -Force

          # 完整包：轻量 exe + 外置 ffmpeg + config + README。
          # 启动比内嵌版快（不用每次解压 85MB），代价是要带着 ffmpeg.exe 一起拷。
          New-Item -ItemType Directory -Force -Path stage-full | Out-Null
          Copy-Item dist\bilibili-submit.exe stage-full\
          Copy-Item dist\ffmpeg.exe stage-full\
          Copy-Item config stage-full\ -Recurse
          Copy-Item README.md stage-full\
          Copy-Item CHANGELOG.md stage-full\
          Compress-Archive -Path stage-full\* -DestinationPath `
            dist\bilibili-submit-full-windows.zip -Force

          # 两个裸 exe 本来就躺在 dist 下，直接作为资产上传。

          Get-ChildItem dist\*.zip, dist\*.exe | Format-Table Name, `
            @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: 创建 Release 并上传
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $tag = $env:TAG
          $notes = @"
          详见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)。

          ## 下载

          | 资产 | 大小 | 说明 |
          |---|---|---|
          | `bilibili-submit-setup.exe` | ~33 MB | **图形界面安装版**，推荐。双击安装，开始菜单有入口，能干净卸载 |
          | `bilibili-submit-gui-portable.exe` | ~72 MB | 图形界面单文件便携版，拷走即用，无需安装 |
          | `bilibili-submit-standalone.exe` | ~70 MB | 命令行单文件版，ffmpeg 已内置 |
          | `bilibili-submit.exe` | ~11 MB | 命令行轻量 exe，需自备 ffmpeg |
          | `bilibili-submit-full-windows.zip` | ~41 MB | 命令行 exe + 外置 ffmpeg.exe，启动最快 |
          | `bilibili-submit-mini-windows.zip` | ~10 MB | 命令行 exe + config，不含 ffmpeg |

          ## 怎么选

          **用图形界面**（大部分人）：
          - 自己的电脑长期用 → `bilibili-submit-setup.exe`（安装版）。
            装完在开始菜单里有，升级直接覆盖，不会弄乱系统；
          - 临时用、U 盘、别人的机器 → `bilibili-submit-gui-portable.exe`，
            不用装，双击就开。

          **用命令行**：
          - 想单文件开箱即用 → `standalone`
          - 在意启动速度 → `full`，让 `ffmpeg.exe` 跟着 exe 走

          ## 图形界面版

          自带扫码登录、投稿表单、批量任务、历史与设置，和命令行共用
          同一套逻辑，两者可以混着用。

          安装版与便携版的区别只在打包方式，功能完全一致：

          | | 安装版 | 便携版 |
          |---|---|---|
          | 安装 | 需要（标准安装向导） | 不需要 |
          | 启动速度 | 快（不用解压） | 较慢（每次解压 ffmpeg 到临时目录） |
          | 快捷方式 | 开始菜单，可选桌面 | 无 |
          | 升级 | 重新运行安装包即可 | 重新下载替换 |
          | 卸载 | 「设置 → 应用」里可卸载 | 直接删文件 |

          图形界面版的用户数据（登录状态、界面偏好、投稿历史）存在
          用户目录下的 `.config\bilibili_submit\`，**卸载不会删除**——
          重装后不用重新扫码。

          ffmpeg 只影响 `cover: auto` 自动抽帧，其他功能不依赖它。

          ## 使用

          图形界面版：双击打开，先在「登录」页扫码（**扫完要在手机上点确认**），
          再去「投稿」页选文件填写信息。

          命令行版：

          1. 解压（下载 exe 的话跳过这步）
          2. `bilibili-submit.exe login` 手机扫码登录
          3. `bilibili-submit.exe upload 视频.mp4 --title "标题" --tid 21 --tag "标签"`
          4. `bilibili-submit.exe check` 自检

          ## 注意事项

          - 首次运行可能被杀毒软件拦截：PyInstaller 的启动器常被误判，
            请在 Windows Defender 里添加白名单。安装版把程序放在
            Program Files 下、且不往临时目录解压文件，被拦的概率比
            单文件版低一些。
          - 安装版默认装到 `C:\Program Files\bilibili-submit`。
            安装时可以选择「仅为我安装」装到用户目录，不需要管理员权限。
          - 建议用 Windows Terminal 打开命令行版以正确显示二维码；
            传统 cmd 显示乱码时，复制链接到手机打开同样可以登录。
          - 新号投稿频控较严，批量投稿请设置任务间隔。
          - 仅供管理自己的账号投稿使用。
          "@
          gh release create $tag `
            "dist\bilibili-submit-setup.exe#图形界面安装版（推荐，约 33MB）" `
            "dist\bilibili-submit-gui-portable.exe#图形界面便携版（免安装，约 72MB）" `
            "dist\bilibili-submit-standalone.exe#命令行单文件版（内置 ffmpeg，约 70MB）" `
            "dist\bilibili-submit.exe#命令行轻量 exe（不含 ffmpeg，约 11MB）" `
            "dist\bilibili-submit-full-windows.zip#命令行完整版（外置 ffmpeg，约 41MB）" `
            "dist\bilibili-submit-mini-windows.zip#命令行轻量版（不含 ffmpeg，约 10MB）" `
            --repo ${{ github.repository }} `
            --title "bilibili-submit $tag" `
            --notes $notes

      - name: 打印下载链接
        if: always()
        shell: pwsh
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $repo = "${{ github.repository }}"
          Write-Host ""
          Write-Host "公开发布完成，下载链接：" -ForegroundColor Green
          Write-Host "  https://github.com/$repo/releases/download/$env:TAG/bilibili-submit-setup.exe"
          Write-Host "  https://github.com/$repo/releases/download/$env:TAG/bilibili-submit-gui-portable.exe"
          Write-Host "  https://github.com/$repo/releases/download/$env:TAG/bilibili-submit-standalone.exe"
          Write-Host "  https://github.com/$repo/releases/download/$env:TAG/bilibili-submit-standalone.exe"
          Write-Host "  https://github.com/$repo/releases/download/$env:TAG/bilibili-submit.exe"
          Write-Host "  https://github.com/$repo/releases/download/$env:TAG/bilibili-submit-full-windows.zip"
          Write-Host "  https://github.com/$repo/releases/download/$env:TAG/bilibili-submit-mini-windows.zip"
