name: Build Windows installer

# 单独一个 workflow，只干一件事：验证「GUI 安装版真的能打出来、能装上、
# 能启动」。推 tag 走 release.yml；改安装相关的东西时用这个先验一遍。
on:
  push:
    branches: [main, master]
    paths:
      - installer.iss
      - bili_submit.spec
      - .github/workflows/build-installer.yml
      - main_gui.py
      - bilibili_submit/**
      # 检查器本身也要验：它是安装流程的第一道关，自己崩掉的话
      # 后面全跳过了（CI 上真发生过——见 check_installer.py 的注释）
      - tools/check_installer.py
      # 中文校验脚本同理：它自己崩了/被改坏时，CI 要能重跑，
      # 否则「校验逻辑退化」会一直藏着直到下次动安装器
      - tools/verify_installer_zh.ps1
      - tests/test_packaging.py
      # 语言文件与安装器同等重要：MessagesFile 指错了/丢文件，
      # 装出来就是英文向导。这两个也在 watch 里。
      - installer_languages/**
      - .gitattributes
  pull_request:
    branches: [main, master]
    paths:
      - installer.iss
      - bili_submit.spec
      - .github/workflows/build-installer.yml
      - main_gui.py
      - bilibili_submit/**
      # 检查器本身也要验：它是安装流程的第一道关，自己崩掉的话
      # 后面全跳过了（CI 上真发生过——见 check_installer.py 的注释）
      - tools/check_installer.py
      # 中文校验脚本同理：它自己崩了/被改坏时，CI 要能重跑，
      # 否则「校验逻辑退化」会一直藏着直到下次动安装器
      - tools/verify_installer_zh.ps1
      - tests/test_packaging.py
      - installer_languages/**
      - .gitattributes
  workflow_dispatch:

jobs:
  installer:
    runs-on: windows-latest
    # 兜底：安装/卸载若卡在 UAC 或残留进程上会一直挂着不返回
    # （CI 上真挂过 8 分钟）。脚本内部已有超时，这里是最后一道——
    # 挂死比失败难查，也让 runner 白占着。
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt pyinstaller

      # 提交前的静态检查：段名拼错、#define 没定义、缺 recursesubdirs
      # 这些在本地就能发现，不必等 ISCC 报错。
      - name: installer.iss 静态检查
        run: python tools/check_installer.py

      - name: 准备 ffmpeg
        run: python tools/setup_ffmpeg.py --dest vendor --force

      # GUI + INSTALLER=1 -> onedir 目录版，ffmpeg 不进归档。
      # 目录名 = EXE_NAME，必须与 installer.iss 的 BuildDir 一致。
      - name: 打包图形界面版（onedir）
        env:
          GUI: '1'
          INSTALLER: '1'
          EXE_NAME: bilibili-submit-gui
        run: python -m PyInstaller bili_submit.spec --noconfirm --clean

      # ffmpeg 放exe 同目录：这是 onedir 最大的好处——不用每次启动
      # 解压 60MB 到临时目录，而且用户能自己换 ffmpeg 版本
      # （ffmpeg.py 本来就优先找这个位置）。
      - name: ffmpeg 放到 exe 同目录
        shell: pwsh
        run: |
          $dir = "dist\bilibili-submit-gui"
          Copy-Item vendor\ffmpeg.exe "$dir\ffmpeg.exe" -Force
          Copy-Item config "$dir\config" -Recurse -Force
          Copy-Item docs\user-guide.html "$dir\user-guide.html" -Force
          # 不拷 README.md：安装目录里只放面向用户的 user-guide.html
          Get-ChildItem $dir | Format-Table Name, `
            @{n='MB';e={[math]::Round($_.Length/1MB,2)}} -AutoSize

      # 装 Inno Setup。官方文档推荐的做法就是 Chocolatey 一条命令，
      # 不用自己下安装器（下了还要静默安装，更容易踩参数坑）。
      - name: 安装 Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress --limit-output

      - name: 编译安装器
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            # 新版 Inno Setup 装在Program Files 而不是 x86
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "找不到 ISCC.exe" }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC 编译失败 ($LASTEXITCODE)" }

      # 这一步是整个 workflow 的核心：装出来、启动、确认没闪退。
      # 只编译不装的话，"装完双击没反应"这种问题照样漏到用户手上。
      - name: 静默安装并冒烟测试
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # ⚠️ 刻意**不从 dist\ 里直接跑**：{src} 是安装器自己所在的目录，
          # 在 dist\ 下跑就等于让 {src} 恰好等于产物目录，任何依赖 {src}
          # 的代码在这儿都"碰巧正确"。用户是从「下载」文件夹双击的，
          # {src} 是下载目录——曾有一版安装器在 InitializeSetup 里拼
          # {src} 找产物，CI 一路绿、每个下载者都装不上。先拷到干净
          # 目录，模拟真实场景。
          $downloads = Join-Path $env:RUNNER_TEMP "fake-downloads"
          New-Item -ItemType Directory -Path $downloads -Force | Out-Null
          Copy-Item "dist\bilibili-submit-setup.exe" "$downloads\" -Force
          $setup = Join-Path $downloads "bilibili-submit-setup.exe"
          if (-not (Test-Path $setup)) { throw "安装器未生成: $setup" }
          Write-Host "从 $setup 安装（模拟用户从下载目录双击）"

          $mb = [math]::Round((Get-Item $setup).Length / 1MB, 1)
          Write-Host "安装器体积: $mb MB"
          # 装的是 onedir（约 13MB 程序 + 62MB ffmpeg），lzma2 压完
          # 应该明显小于 75MB。低于 20MB 说明 ffmpeg 或 _internal 漏了。
          if ($mb -lt 20) { throw "安装器只有 $mb MB，ffmpeg 或 _internal 很可能没打进去" }

          # /VERYSILENT /SUPPRESSMSGBOXES /NORESTART 无人值守安装
          # 必须 Start-Process -Wait：安装器是 GUI 程序，用 `& $setup`
          # 调用时 PowerShell 立即返回、$LASTEXITCODE 从不被赋值
          # （"静默安装失败 ()"——CI 上真卡过这一下），等不到结果。
          # 参数先存数组，免得写多行——PowerShell 的续行符是反引号 `
          # 不是反斜杠 \，写成 \ 的话每行会被当成独立命令（CI 上真报过
          # "The term '-ArgumentList' is not recognized"）。
          # /CURRENTUSER：装到 %LOCALAPPDATA%\Programs 而不是 Program Files。
          # 这里刻意**不走** UAC——installer.iss 里 PrivilegesRequired=admin，
          # 静默安装时安装器会 fork 自己去提权，父进程立即退出、子进程等
          # UAC 确认，在无人值守的 CI 上就是永久挂起（真挂过 8 分钟）。
          #
          # 换来的代价是测不到 Program Files 那条路径，但那条路径真正
          # 要防的是「往只读目录写用户数据」——由 test_user_data_lives_
          # outside_the_program_directory 单独守着，不靠这里覆盖。
          # /LANGCHECK：打开 installer.iss [Code] 段里的语言探针，让安装器
          # 把「运行时真正生效的那几条消息里有没有汉字」写成 ASCII 报告。
          # 只在这个开关存在时才动作，正常用户安装不会多出文件。
          # /LOG：Inno 自己写安装日志。探针的异常消息是中文的，
          # 经 ACP 编码后报告里读不到内容，只能靠这个日志看原文。
          $setupArgs = @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/CURRENTUSER","/LANGCHECK","/LOG")
          Write-Host "开始静默安装..."
          $setupProc = Start-Process -FilePath $setup -ArgumentList $setupArgs -PassThru
          $waited = 0
          while (-not $setupProc.HasExited -and $waited -lt 120) {
            Start-Sleep -Seconds 3
            $waited += 3
          }
          if (-not $setupProc.HasExited) {
            Get-Process -Name "bilibili-submit-setup" -ErrorAction SilentlyContinue |
              Stop-Process -Force
            throw "静默安装超时（${waited}s）——安装器卡住了（多半是 UAC 提权）"
          }
          Write-Host "安装结束，退出码 $($setupProc.ExitCode)，耗时 ${waited}s"
          if ($setupProc.ExitCode -ne 0) {
            # 安装失败时把 Inno 自己的日志打出来：退出码只说「失败」，
            # 原因（比如探针抛的异常）只写在日志里。不打的话，CI 上一片
            # 空白，只能靠猜——上一版就因为这样卡了好几轮。
            # 编码按 Unicode 读：Inno 的日志是 UTF-16，中文报错用默认
            # 编码读出来是乱码，反而更难认。
            $innoLog = Get-ChildItem "$env:TEMP\Setup Log*.txt" -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if ($innoLog) {
              Write-Host "--- Inno 安装日志 $($innoLog.FullName) ---"
              Get-Content -LiteralPath $innoLog.FullName -Encoding Unicode |
                Select-Object -Last 40 | ForEach-Object { Write-Host "  $_" }
            } else {
              Write-Host "没找到 Inno 安装日志（$env:TEMP 下没有 Setup Log*.txt）"
            }
            throw "静默安装失败 ($($setupProc.ExitCode))"
          }
          Start-Sleep -Seconds 3

          $app = "$env:LOCALAPPDATA\Programs\bilibili-submit"
          $exe = "$app\bilibili-submit-gui.exe"
          if (-not (Test-Path $exe)) {
            throw "安装后找不到 $exe（实际目录：$(Test-Path $app)）"
          }

          # 用户真正能用到的三个文件，少一个都算安装失败
          foreach ($f in @("ffmpeg.exe", "config\config.example.yaml", "user-guide.html")) {
            if (-not (Test-Path "$app\$f")) { throw "安装后缺少 $f" }
          }
          # _internal 是 Python 运行时，漏了整个程序起不来
          if (-not (Test-Path "$app\_internal")) { throw "缺少 _internal\（Python 运行时）" }

          # ffmpeg 必须和 exe 同目录（而不是 _internal 里）——
          # 代码只优先找 exe 同目录，放错地方等于没带
          if (-not (Test-Path "$app\ffmpeg.exe")) { throw "ffmpeg.exe 不在 exe 同目录" }

          Write-Host "安装目录内容:"
          Get-ChildItem $app | Format-Table Name, `
            @{n='MB';e={[math]::Round($_.Length/1MB,2)}} -AutoSize

          # 启动后不能立刻退出：缺 tkinter 时 windowed 程序会静默失败
          Write-Host "启动安装后的程序..."
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($proc.HasExited) {
            throw "安装后的程序启动即退出（退出码 $($proc.ExitCode)）"
          }
          # 按进程名杀，不只是这个 PID——PyInstaller 可能留下子进程，
          # 残留会让卸载器一直等着程序关闭（CI 上就挂死过这一步）。
          Get-Process -Name "bilibili-submit-gui" -ErrorAction SilentlyContinue |
            Stop-Process -Force
          Start-Sleep -Seconds 2
          Write-Host "安装版启动正常"

          # 卸载也要验：卸载器坏掉的话用户会留着 Program Files 一地
          # 碎片，升级也挡路。
          $unins = "$app\unins000.exe"
          if (-not (Test-Path $unins)) { throw "缺少卸载器 $unins" }
          # 不用 -Wait：卸载器若卡在 UAC 或残留进程上会永远不返回。
          # 轮询 + 超时，超时就杀掉并报错——挂死比失败难查得多。
          $up = Start-Process -FilePath $unins -ArgumentList "/VERYSILENT" -PassThru
          $waited = 0
          while (-not $up.HasExited -and $waited -lt 90) {
            Start-Sleep -Seconds 3
            $waited += 3
          }
          if (-not $up.HasExited) {
            Stop-Process -Id $up.Id -Force
            throw "静默卸载超时（${waited}s）——卸载器卡住了（UAC 或残留进程？）"
          }
          if ($up.ExitCode -ne 0) { throw "静默卸载失败 ($($up.ExitCode))" }
          Start-Sleep -Seconds 2
          if (Test-Path $exe) { throw "卸载后主程序仍在：卸载不干净，升级会被挡" }
          Write-Host "卸载正常（${waited}s）"

          # 用户数据（cookie / 界面偏好）必须在 %USERPROFILE% 下，
          # 卸载不能碰——删了等于让人重新扫码登录。
          $userData = "$env:USERPROFILE\.config\bilibili_submit"
          if (Test-Path $userData) {
            Write-Host "用户数据目录存在: $userData（卸载未删除，正确）"
          } else {
            Write-Host "本次未产生用户数据目录（CI 上未登录，属正常）"
          }

          exit 0

      # 静默安装全程不渲染界面，所以上面的冒烟测试**证明不了**
      # 「安装向导是中文的」——而这正是 v0.2.7 之前长期存在的状态：
      # [Languages] 里Name 写着 chinese，MessagesFile 却指向英文的
      # Default.isl，装出来全是英文，而且没有任何检查能发现。
      #
      # 这里直接扫编译产物：安装器把消息文本编进 exe，Unicode 版
      # （Inno Setup 6 只有 Unicode 版）按 UTF-16LE 存。
      # 所以只要中文文案在、英文向导文案不在，就证明 MessagesFile
      # 真的生效了。这是唯一能拿到端到端证据的地方——CI 之外的
      # 任何检查（包括 tools/check_installer.py）都只能证明
      # 「配置写对了」，证明不了「编出来是这个样子」。
      #
      # ⚠️ 两处编码都试：万一某个 Inno Setup 版本把消息放在压缩块里，
      #    UTF-16 读不到，至少 ASCII(=UTF-16LE 的英文部分)还能命中英文
      #    侧的反向断言，两边都空才报错——宁可误报也不漏报。
      - name: 验证安装器里编进的是中文向导
        shell: pwsh
        # 逻辑放在 tools/verify_installer_zh.ps1 而不是内联在这里：
        # release.yml 也要跑同一段，两份内联副本迟早漂移。
        #
        # 读的是上一步静默安装时，installer.iss [Code] 段的 /LANGCHECK
        # 探针写下的报告——那是**运行时真正生效**的消息，而不是我们对
        # 配置的猜测。曾经试过直接扫 setup.exe 的字节，不可行：消息被
        # lzma2 压缩，明文不落盘（细节见脚本头部注释）。
        #
        # {tmp} 在安装器里展开成 %TEMP%，CI runner 上就是这个路径。
        # 报告写在 {app}（安装目录）而不是 %TEMP%：Inno 的 {tmp} 是它自己的
        # 安装临时目录（%TEMP%\is-XXXXX\），安装一结束就删掉了。
        run: |
          $expected = "$env:LOCALAPPDATA\Programs\bilibili-submit\lang-report.txt"
          if (-not (Test-Path $expected)) {
            # 找不到就把它搜出来贴到日志里。「探针没跑」和「跑到了别的
            # 地方」是两回事，日志里能一眼看出是哪种，省一轮往返。
            Write-Host "预期位置没有报告，全盘搜一下 lang-report.txt："
            Get-ChildItem -Path $env:LOCALAPPDATA, $env:TEMP, "$env:USERPROFILE" `
              -Filter "lang-report.txt" -Recurse -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "  找到: $($_.FullName)" }
            Write-Host "安装目录内容："
            Get-ChildItem "$env:LOCALAPPDATA\Programs\bilibili-submit" -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "  $($_.Name)" }
          }
          ./tools/verify_installer_zh.ps1 -ReportPath $expected

      - name: 上传安装器
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-submit-installer
          path: dist/bilibili-submit-setup.exe
          retention-days: 30
          if-no-files-found: error
