# 哔哩哔哩自动投稿程序 —— 配置示例
# 用法：python run.py submit -c config/my.yaml
# 首次使用请先执行：python run.py login

account:
  # Cookie 保存位置，权限为 0600，请勿外传
  cookie_file: "~/.config/bilibili_submit/cookie.json"
  # 需要代理时填写，如 "http://127.0.0.1:7890"
  # 登录和投稿都用这个；登录时也可临时覆盖：
  #   python run.py login --proxy http://127.0.0.1:7890
  proxy: null

upload:
  # 上传线路：auto 自动择优，也可指定 bda2 / tx / estx / bldsa / akbd
  line: auto
  # ugcupos/bup 适合大陆；港澳台与海外改 ugcupos/bupfetch
  profile: "ugcupos/bup"
  # 并发分片数，上限 4。调高不会更快，反而更容易触发限流
  concurrency: 3
  # 断点续传（仅在中断后 2 小时内有效）
  resume: true
  chunk_retries: 3
  show_progress: true

submit:
  # 投稿后端：web（默认）/ web/v2（旧接口）/ app（需 access_key）
  backend: web
  # 触发 601 频控后的阶梯退避秒数
  cooldown_seconds: [300, 600, 1200, 1800, 3600]
  # 仅 backend=app 时需要；纯扫码登录拿不到 access_key，保持为空即可
  app: {}

# 所有任务继承这些默认值，任务内可单独覆盖
defaults:
  tid: 21                # 分区 ID，用 `python run.py tid` 查看常用分区
  copyright: 1           # 1=自制 2=转载（转载时 source 必填）
  source: ""
  tag: "日常,分享"
  desc: "自动投稿"
  cover: null            # 图片路径 / auto（用 ffmpeg 抽首帧）/ null
  no_reprint: 0          # 0=允许转载 1=禁止转载
  dtime: null
  dtime_offset_hours: null
  # 互动设置：关掉之后就不再有新的弹幕/评论，已发布的稿件不受影响
  up_close_danmu: false
  up_close_reply: false
  up_selection_reply: false   # 开启精选评论
  # 音质增强。源文件本身得是杜比/无损音轨，否则开了也不会有效果
  dolby: 0
  hires: 0                    # Hi-Res（接口字段名叫 lossless_music）

tasks:
  # ---- 模式 A：单个文件 ----
  - name: "单个视频投稿"
    type: single
    file: "/path/to/video.mp4"
    title: "视频标题（最多 80 字）"
    desc: "视频简介"
    tag: "标签1,标签2"
    cover: auto
    # 定时发布：距今至少 4 小时，二选一
    # dtime: 1791638400
    dtime_offset_hours: 5

  # ---- 模式 C：多分 P（多个文件合成**一个**稿件） ----
  # 一个 av/bv 号下面挂 P1/P2/P3，播放器里可连续切换。
  # 只投一次稿，所以定时、封面、标签对整个稿件生效一次。
  - name: "旅行合集"
    type: multip
    # files 的顺序就是 P1/P2/P3 的顺序，不会重排
    files:
      - "/path/to/旅行_01.mp4"
      - "/path/to/旅行_02.mp4"
      - "/path/to/旅行_03.mp4"
    # 分 P 标题，按上面顺序一一对应；不填或填少了就用文件名
    part_titles: ["出发", "路上", "到达"]
    title: "旅行合集"
    tag: "旅行,记录"
    cover: auto

  # ---- 模式 C2：多分 P，直接给目录 ----
  # 目录下所有视频就是这个稿件的各分 P，不用逐个列文件名。
  # 只扫目录第一层（不进子文件夹）。
  - name: "课程合集"
    type: multip
    dir: "/path/to/课程"
    title: "课程合集"

  # ---- 模式 D：按文件夹分组批量投稿 ----
  # 每个子文件夹出一个稿件，文件夹里的多个视频就是那个稿件的分 P。
  # 只扫一层子目录；根目录第一层散落的文件各自独立投稿，不合并。
  - name: "按文件夹分P"
    type: batch
    dir: "/path/to/视频"
    group_by: folder      # 或 prefix（按文件名前缀分）
    tag: "合集"

  # ---- 模式 B：目录批量 ----
  - name: "系列合集"
    type: batch
    dir: "/path/to/series"
    include: ["*.mp4", "*.mkv"]
    exclude: ["*tmp*", "*sample*"]
    sort: name            # name | mtime
    # 模板变量：{stem} 文件名主体、{name} 完整文件名、{n} 序号
    title_template: "{stem} | 第{n}期"
    desc_template: "本期内容：{stem}"
    tid: 21
    tag: "系列,合集"
    cover: auto
    # 每条之间等待的分钟数，用于规避 601 频控
    per_task_interval_minutes: 30
    stop_on_error: true
    max_items: null
