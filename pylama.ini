# pylama 配置
# 依赖在 requirements.txt 里是软依赖，不进发行包（PyInstaller 也不需要它）。
#
# 用法：
#   pip install pylama
#   pylama --max-complexity 20 bilibili_submit tests tools
#
# 注意：max-complexity 只能从命令行传，写在本文件里不生效（mccabe 的限制）。
# 下面两处是核心流程，刻意保持单函数以便一眼读完，阈值设为 20 保留告警能力
# （新增更复杂的函数仍会报），同时不误报这两处：
#   client.py:134  BiliClient._request —— 统一处理 -352 重放与错误归一化
#   upload.py:362  upload_video        —— 分片上传的重试/续传/合并交织在一起
# 拆成多个函数反而需要跨函数传递 8 个以上状态，得不偿失。

[pylama]
format = pylint
skip = */.venv/*,*/build/*,*/dist/*,*/__pycache__/*,*/.pytest_cache/*

# 内部函数用参数传参是有意的（不构成未使用变量）
# 顶层 except 都要记日志并降级，不该直接崩
ignore = W0613,W0703
